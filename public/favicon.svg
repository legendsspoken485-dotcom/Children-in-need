<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .bridge-arch { stroke: #EA580C; }
    .bridge-cable { stroke: #F97316; }
    .bridge-deck { fill: #0F172A; }
    .bridge-pier { fill: #0F172A; }
    .bridge-base { stroke: #0F172A; }
    .bridge-water { stroke: #EA580C; }
    @media (prefers-color-scheme: dark) {
      .bridge-arch { stroke: #FB923C; }
      .bridge-cable { stroke: #FB923C; }
      .bridge-deck { fill: #FFFFFF; }
      .bridge-pier { fill: #E2E8F0; }
      .bridge-base { stroke: #CBD5E1; }
      .bridge-water { stroke: #FB923C; }
    }
  </style>
  <!-- Primary sweeping bridge arch in warm vibrant orange -->
  <path class="bridge-arch" d="M 3.5 21.5 C 7.5 9 11.5 6 16 6 C 20.5 6 24.5 9 28.5 21.5" stroke-width="2.75" stroke-linecap="round"/>
  <!-- Solid structural bridge deck -->
  <rect class="bridge-deck" x="2" y="16.5" width="28" height="2" rx="1"/>
  <!-- Vertical suspension / structural support lines -->
  <line class="bridge-cable" x1="8.5" y1="13" x2="8.5" y2="16.5" stroke-width="1.5" stroke-linecap="round"/>
  <line class="bridge-cable" x1="12" y1="8.8" x2="12" y2="16.5" stroke-width="1.5" stroke-linecap="round"/>
  <line class="bridge-cable" x1="16" y1="6" x2="16" y2="16.5" stroke-width="1.6" stroke-linecap="round"/>
  <line class="bridge-cable" x1="20" y1="8.8" x2="20" y2="16.5" stroke-width="1.5" stroke-linecap="round"/>
  <line class="bridge-cable" x1="23.5" y1="13" x2="23.5" y2="16.5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Deep foundation pier pillars -->
  <rect class="bridge-pier" x="5.5" y="18.5" width="2" height="6.5" rx="0.5"/>
  <rect class="bridge-pier" x="24.5" y="18.5" width="2" height="6.5" rx="0.5"/>
  <!-- Foundation anchor waterline -->
  <path class="bridge-base" d="M 3 25 H 10 M 22 25 H 29" stroke-width="1.5" stroke-linecap="round"/>
  <path class="bridge-water" d="M 12.5 25 H 19.5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
